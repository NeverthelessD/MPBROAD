<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyPhotoBook_ROAD 앱 아이콘: 초록 천 표지 + 겹친 사진 세 장 + 이름 (made by. Nevertheless_D) -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#257A5E"/>
      <stop offset="1" stop-color="#1B5F49"/>
    </linearGradient>
    <clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.8" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#cover)"/>
  </g>
  <g clip-path="url(#shape)">
    <g transform="translate(100 100) scale(8.24)">
      <rect x="0" y="0" width="14" height="100" fill="#000" opacity="0.16"/>
      <rect x="13.5" y="0" width="1.5" height="100" fill="#fff" opacity="0.12"/>
      <g filter="url(#card)">
        <g transform="rotate(-13 57 42)"><rect x="37" y="19" width="40" height="46" rx="1.6" fill="#fff"/><rect x="40" y="22" width="34" height="31" fill="#F3C9A8"/><circle cx="48" cy="30" r="3.2" fill="#FFF6E5"/><path d="M40 47 L56 39 L74 46 L74 53 L40 53Z" fill="#8C5A4A"/></g>
        <g transform="rotate(9 57 42)"><rect x="37" y="19" width="40" height="46" rx="1.6" fill="#fff"/><rect x="40" y="22" width="34" height="31" fill="#9DB8C9"/><path d="M40 46 L52 40 L61 44 L74 37 L74 53 L40 53Z" fill="#4C6A80"/></g>
        <rect x="37" y="17" width="40" height="46" rx="1.6" fill="#fff"/>
      </g>
      <rect x="40" y="20" width="34" height="32" fill="#CFE3D7"/>
      <circle cx="66" cy="28" r="4" fill="#F2B23A"/>
      <path d="M40 45 Q57 35 74 44 L74 52 L40 52Z" fill="#1F6B52"/>
      <text x="57" y="80" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="9.6" letter-spacing="-0.2" fill="#FBF3DF">MyPhotoBook</text>
      <text x="57" y="88.5" text-anchor="middle" font-family="Space Grotesk" font-weight="600" font-size="5.4" letter-spacing="1.2" fill="#F2B23A">_ROAD</text>
    </g>
  </g>
</svg>
